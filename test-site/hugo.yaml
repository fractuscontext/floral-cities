relativeURLs: false
canonifyURLs: false
locale: en-us
title: "My Little Blog"
theme: floral-cities

pagination:
  pagerSize: 5

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        enable: true
        delimiters:
          block:
            - ['\[', '\]']
            - ['$$', '$$']
          inline:
            - ['\(', '\)']
