<div class="code-wrapper">
    <div class="code-header">
        <span class="code-file">{{ .Attributes.title }}</span>
        <span class="code-lang">{{ .Type }}</span>
    </div>
    <div class="code-content">
        {{- $result := transform.HighlightCodeBlock . -}}
        {{- $result.Wrapped -}}
    </div>
</div>
